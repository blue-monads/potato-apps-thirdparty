name: Talha - Crossy Road
info: Talha - Crossy Road Game Clone (https://github.com/he-is-talha/html-css-javascript-games)
slug: talha-crossy-road
tags:
  - entertainment
  - game
format_version: '0.0.2'
author_name: Bornjre
author_email: bornjre@gmail.com
author_site: https://github.com/bornjre
license: MIT
version: '0.0.2'

spaces:
  - namespace: talha-crossy-road
    executor_type: luaz
    server_file: server.lua
    is_default: true
    route_options:
      router_type: simple
      serve_folder: public
      force_html_extension: false
      force_index_html_file: true
      on_not_found_file: index.html

developer:
  server_url: http://localhost:7777
  token_env: SIMPLE_DEV_TOKEN
  output_zip_file: package.spk.zip
  include_files:
    - public/*,public